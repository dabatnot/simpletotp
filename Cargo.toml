[package]
name = "simpletotp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
data-encoding = "2"
futures-lite = "2"
gtk4 = { version = "0.11", features = ["v4_10"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ksni = { version = "0.3", features = ["blocking"] }
prost = "0.14"
qrcodegen-image = "1.5"
rqrr = "0.11"
secret-service = { version = "5.2", default-features = false, features = ["rt-async-io-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth", "serde", "qr"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
v4l = "0.14"
